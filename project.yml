name: Smail
options:
  developmentLanguage: en
  bundleIdPrefix: you.simin
  deploymentTarget:
    iOS: '18.0'
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    exactVersion: 2.13.9
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.0.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '6'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
    GOOGLE_CLIENT_ID: unconfigured.apps.googleusercontent.com
    GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.unconfigured
targets:
  Smail:
    type: application
    platform: iOS
    sources: [Smail]
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: SwiftSoup
        product: SwiftSoup
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: you.simin.Smail
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_FILE: Smail/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SmailTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Smail
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SmailUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Smail
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Smail:
    build:
      targets:
        Smail: all
    test:
      targets: [SmailTests, SmailUITests]
